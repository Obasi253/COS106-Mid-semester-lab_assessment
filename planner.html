<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Academic Planner | Task Manager</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <header>
    <div class="logo">Obasi.dev</div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>

        <li><a href="planner.html" class="active">Planner</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

    <main>
    <section class="card floating">
      <h1>Academic Task & Assessment Planner</h1>
      <p>Schedule your coursework, track assignment deadlines, and submit completed assessments directly to your lecturer via email.</p>

      <!-- Rich Task Entry Form -->
      <form id="plannerForm" onsubmit="event.preventDefault();" style="margin-top: 1.5rem;">
        <label for="taskTitle">Assessment / Task Title *</label>
        <input type="text" id="taskTitle" placeholder="e.g. COS 106 Mid-Semester Lab Submission" required>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem;">
          <div>
            <label for="startDate">Assigned Schedule Date *</label>
            <input type="date" id="startDate" required>
          </div>
          <div>
            <label for="dueDate">Submission Deadline *</label>
            <input type="date" id="dueDate" required>
          </div>
        </div>

        <label for="lecturerEmail">Lecturer Email Address *</label>
        <input type="email" id="lecturerEmail" placeholder="lecturer@miva.edu.ng" required>

        <label for="taskNotes">Assessment Submission Notes / Links</label>
        <textarea id="taskNotes" rows="3" placeholder="Paste your live portfolio link or submission details here..."></textarea>

        <button type="button" id="addTaskBtn" class="btn" style="width: 100%;">Add Task to Schedule</button>
      </form>
    </section>

    <section class="card">
      <h2>Scheduled Tasks & Submissions</h2>
      <div id="taskList" style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem;">
        <!-- Dynamic Tasks render here -->
      </div>
    </section>
  </main>
