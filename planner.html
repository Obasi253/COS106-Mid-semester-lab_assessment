<!DOCTYPE html>
<html lang="en">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Academic Planner</h1>
        <p>Interactive Study & Task Management System</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Me</a>
        <a href="projects.html">Projects</a>
        <a href="planner.html" class="active">Academic Planner</a>
        <a href="contact.html">Contact</a>

    <main>
        <section>
            <h2>Manage Coursework Tasks</h2>
            <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1rem;">Tap a task to mark it as completed, or hit delete to clear it.</p>
            
            <div class="planner-input">
                <input type="text" id="taskInput" placeholder="Enter a new task (e.g., Study COS 106 DOM manipulation)...">
                <button onclick="addTask()" class="btn">Add Task</button>
            </div>

            <div id="taskList">
                <!-- JavaScript renders dynamic task cards here -->
            </div>
        </section>
    </main>
