<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="style.css">

  <header>
    <div class="logo">Obasi.dev</div>
    <nav>
      <ul>

  <main>
    <section class="card floating">
      <h1>Interactive Academic Study Planner</h1>
      <p>Manage daily study targets, assignment deadlines, and lab tasks using client-side DOM manipulation.</p>

      <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
        <input type="text" id="taskInput" placeholder="Enter a study target (e.g. Complete COS 106 HTML assignment)" style="margin-bottom: 0;">
        <button type="button" id="addTaskBtn" class="btn">Add Task</button>
      </div>

      <ul id="taskList" style="list-style: none; margin-top: 1.5rem;">
        <!-- Dynamic Tasks appended via JavaScript -->
      </ul>
    </section>
  </main>
