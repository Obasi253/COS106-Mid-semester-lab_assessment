<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Academic Inquiries</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <header>
    <div class="logo">Obasi.dev</div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="planner.html">Planner</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

    <main>
    <section class="card floating">
      <h1>Connect & Collaborate</h1>
      <p>I am open to discuss partnerships, research collaborations, internship opportunities, and tech projects.</p>

      <!-- Direct Professional Social Link -->
      <div style="margin-bottom: 2rem;">
        <a href="https://www.linkedin.com/in/your-linkedin-profile" target="_blank" class="btn linkedin-btn">
          Connect on LinkedIn &rarr;
        </a>
      </div>

      <form id="contactForm">
        <fieldset>
          <legend>Contact Information</legend>

          <label for="fullName">Your Full Name *</label>
          <input type="text" id="fullName" name="fullName" placeholder="Enter your name" required>

          <label for="email">Your Email Address *</label>
          <input type="email" id="email" name="email" placeholder="name@example.com" required>
        </fieldset>

        <fieldset>
          <legend>Inquiry Purpose</legend>

          <label for="inquiryType">Reason for Outreach *</label>
          <select id="inquiryType" name="inquiryType" required>
            <option value="Partnership">Strategic Partnership</option>
            <option value="Collaboration">Academic / Tech Collaboration</option>
            <option value="Internship">Internship Opportunity</option>
            <option value="Project">Software / AI Project Inquiry</option>
          </select>

          <label for="message">Message *</label>
          <textarea id="message" name="message" rows="5" placeholder="Details about your proposed partnership, project, or opportunity..." required></textarea>
        </fieldset>

        <button type="submit" class="btn">Send Direct Email</button>
      </form>

      <p id="formStatus" style="margin-top: 1rem; font-weight: 600;"></p>
    </section>
  </main>
